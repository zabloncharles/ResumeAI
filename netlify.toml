[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"
  # Allowlisting non-secret client keys that are expected in the build output
  # Firebase Web API keys are public and safe to expose per Firebase docs
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,VITE_FIREBASE_API_KEY"

# Environment variables will be set in Netlify's dashboard
# Required environment variables:
# - OPENAI_API_KEY
# - FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY (Admin SDK for auth)

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false