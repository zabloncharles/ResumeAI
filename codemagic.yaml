# Codemagic CI/CD for Brightfolio (Capacitor)
#
# Before running the iOS workflow, connect an App Store Connect API key in
# Codemagic and enable automatic iOS signing for com.brightfolio.app.
# Before publishing Android, upload a keystore in Codemagic and use the same
# keystore for every future Google Play release.

workflows:
  ios-release:
    name: Brightfolio iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BRIGHTFOLIO_APP_STORE_CONNECT
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.brightfolio.app
      groups:
        - brightfolio-production
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6826103999"
      node: 22
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: npm install
      - name: Install Capacitor build dependencies
        script: |
          npm install --no-save \
            @capacitor/core@8.5.3 \
            @capacitor/cli@8.5.3 \
            @capacitor/ios@8.5.3 \
            @capacitor/app@8.1.2 \
            @capacitor/splash-screen@8.0.2
      - name: Build web app and create iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Apply iOS signing settings
        script: xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-simulator-preview:
    name: Brightfolio iOS Simulator Preview
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - brightfolio-production
      node: 22
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: npm install
      - name: Install Capacitor build dependencies
        script: npm install --no-save @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/ios@8.5.3 @capacitor/app@8.1.2 @capacitor/splash-screen@8.0.2
      - name: Build web app and create iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Build iOS Simulator app
        script: xcodebuild build -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$CM_BUILD_DIR/build/ios/simulator"
    artifacts:
      - build/ios/simulator/Build/Products/Debug-iphonesimulator/App.app

  android-release:
    name: Brightfolio Android Release
    max_build_duration: 120
    # mac_mini_m2 is used here so the workflow works on Codemagic's
    # individual free tier. Linux X2 requires billing to be enabled.
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - brightfolio_android_keystore
      groups:
        - brightfolio-production
      vars:
        PACKAGE_NAME: com.brightfolio.app
      node: 22
    scripts:
      - name: Set up Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install JavaScript dependencies
        script: npm install
      - name: Install Capacitor build dependencies
        script: |
          npm install --no-save \
            @capacitor/core@8.5.3 \
            @capacitor/cli@8.5.3 \
            @capacitor/android@8.5.3 \
            @capacitor/app@8.1.2 \
            @capacitor/splash-screen@8.0.2
      - name: Build web app and create Android project
        script: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Configure Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          signing = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
          text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
          text = text.replace(
              "        release {\n            minifyEnabled false",
              "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
              1,
          )
          path.write_text(text)
          PY
      - name: Build signed Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping/**
