<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/brightfolio-icon.svg" />
  <link rel="apple-touch-icon" href="/icons/brightfolio-icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#16aeac" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Brightfolio" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brightfolio — AI Career Toolkit</title>
</head>

<body>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
